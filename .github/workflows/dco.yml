# Developer Certificate of Origin (https://developercertificate.org).
# Every commit in a pull request must carry a "Signed-off-by: Name <email>" line, added with
# `git commit -s`. Dependabot's commits are exempt: a bot cannot certify the DCO, and its
# updates are reviewed by a maintainer. See CONTRIBUTING.md, "Licensing of contributions".
#
# It runs on PRs into `staging` only, because every contribution enters there. Release PRs
# from `staging` to `main` contain only commits that already passed this check (plus history
# from before the DCO was adopted on 9 November 2026), so checking them again adds nothing.
#
# Maintainer remediation: when a contributor's PR is good but their commits are unsigned, a
# maintainer can apply the "dco-maintainer-signoff" label instead of rewriting the contributor's
# branch. The maintainer then certifies those commits under DCO clause (b) (the work is published
# in a public fork of this AGPL-3.0 project) and adds their own Signed-off-by to the squash-merge
# commit. Only users with triage access or above can apply labels, so contributors cannot use it
# to skip the check. The run names the commits being remediated and who applied the label.
name: DCO

on:
  pull_request:
    branches: [staging]
    # "edited" catches a PR retargeted from main to staging: GitHub sends no other event then,
    # so without it the required check would wait forever. The check also re-runs on title or
    # description edits. It is deliberately not skipped then: a skipped run counts as passing
    # and would replace an earlier failure on the same commit.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read

jobs:
  dco:
    name: DCO sign-off
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          remediated=0
          if echo "$LABELS" | jq -e 'index("dco-maintainer-signoff")' >/dev/null; then remediated=1; fi
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <[^>]+@[^>]+>$'; then
              echo "ok      $(git log -1 --format='%h %s' "$c")"
            else
              level=error; [ "$remediated" -eq 1 ] && level=notice
              echo "::$level::Commit $(git log -1 --format='%h' "$c") (\"$(git log -1 --format='%s' "$c")\") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ] && [ "$remediated" -eq 1 ]; then
            # Record who applied the label (best effort; only triage+ users can apply labels at all).
            by=$(gh api "repos/$REPO/issues/$PR/events" --paginate 2>/dev/null | jq -rs '[.[][] | select(.event=="labeled" and .label.name=="dco-maintainer-signoff")] | last | .actor.login // empty' 2>/dev/null || true)
            echo
            echo "::notice::The unsigned commits above are certified by maintainer ${by:-unknown} through the dco-maintainer-signoff label (DCO clause b). The maintainer adds their Signed-off-by to the squash-merge commit."
            {
              echo "### DCO: maintainer remediation"
              echo "Unsigned commits in this PR are certified by **${by:-unknown}** under DCO clause (b) via the \`dco-maintainer-signoff\` label."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign off your commits to certify the Developer Certificate of Origin:"
            echo "  one commit:     git commit --amend -s --no-edit"
            echo "  several commits: git rebase --signoff origin/staging"
            echo "then push again with: git push --force-with-lease"
            exit 1
          fi
