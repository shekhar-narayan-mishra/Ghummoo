# Local use and self-hosting only. Secrets go in an untracked .env next to this file.
services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5050"
      MONGODB_URI: mongodb://mongo:27017/ghumo
      SEED_ON_EMPTY: "true"
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
